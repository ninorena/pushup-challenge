<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pushup Challenge</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Pushups">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Pushup Challenge</h1>
      <p id="week-label" class="muted">Loading…</p>
    </header>

    <div id="demo-banner" class="banner" hidden>
      <p>Demo mode: entries stay in this browser only. Set <code>scriptUrl</code> in <code>config.js</code> to share them.</p>
      <p>The demo starts season 1 this week. To test past weeks, add <code>?start=2026-10-05</code> to the address.</p>
      <button type="button" id="clear-demo" class="secondary">Clear demo entries</button>
    </div>
    <p id="error" class="banner error" hidden></p>

    <section id="whats-new" class="card whats-new" aria-live="polite" hidden></section>

    <section id="progress" class="card"></section>

    <details id="how-it-works" class="card">
      <summary>How it works</summary>
      <p id="how-intro"></p>
      <ol id="first-steps"></ol>
      <h3>Rules</h3>
      <ul id="rules"></ul>
    </details>

    <section class="card">
      <h2>Log pushups</h2>
      <div class="tabs" role="tablist" aria-label="What to log">
        <button type="button" role="tab" id="tab-reps" aria-selected="true" aria-controls="log-form">Log reps</button>
        <button type="button" role="tab" id="tab-test" aria-selected="false" aria-controls="log-form" tabindex="-1">Max-reps test</button>
      </div>
      <form id="log-form" role="tabpanel" aria-labelledby="tab-reps">
        <div id="test-guide" hidden></div>
        <label>Name
          <select id="name-select" required aria-describedby="form-status"></select>
        </label>
        <label id="new-name-label" hidden>Your name
          <input id="new-name" name="name" autocomplete="off" spellcheck="false" maxlength="40" aria-describedby="form-status">
        </label>
        <div class="row">
          <label>Reps
            <input id="reps" name="reps" type="number" inputmode="numeric" step="1" min="-2000" max="2000" required aria-describedby="form-status">
          </label>
          <label>Day
            <input id="date" name="date" type="date" required aria-describedby="form-status">
          </label>
        </div>
        <label id="take-off-label" class="check">
          <input id="take-off" type="checkbox"> Take off reps (fix a mistake)
        </label>
        <p id="set-guide" class="muted"></p>
        <button type="submit" id="submit">Log reps</button>
        <p id="form-status" class="muted" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <h2>This week</h2>
      <div id="this-week"></div>
    </section>

    <section class="card">
      <h2>Past weeks</h2>
      <div id="history"></div>
    </section>

  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
